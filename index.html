<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AFK</title>
<meta name="description" content="A short interactive story about where the night goes.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="room" class="panel">
    <div id="stage"><img id="bgA" alt=""><img id="bgB" alt=""><div id="ovl"></div><div id="hots"></div></div>
    <div id="rtop">
      <div class="nav"><button data-v="desk">Desk</button><button data-v="door">Door</button><button data-v="window">Window</button></div>
      <div class="sp"></div>
      <div id="rclock">10:47 PM</div>
      <button class="ib" id="sndBtn" title="Sound" aria-label="Toggle sound">🔇</button>
      <button class="ib" id="helpBtn" title="How to play" aria-label="How to play">?</button>
    </div>
    <div id="sticky"></div>
    <div id="tag"></div>
    <div id="card"></div>
    <div id="talk"><div id="line" class="it"></div><div class="chips" id="chips"></div></div>
    <div class="veil"><span>look at the room</span></div>
  </div>
  <div id="phone" class="panel">
    <div class="device">
      <div id="psb"><span id="ptime">10:47</span><span id="pbat">🔋 41%</span></div>
      <div id="pscr"></div>
      <div id="banner"></div>
    </div>
    <div class="veil"><span>look at your phone</span></div>
  </div>
  <div id="tabs"><button data-t="room">ROOM<i></i></button><button data-t="phone">PHONE<i></i></button></div>
</div>
<div id="cine"><div class="bg"></div><div class="in"></div></div>
<script src="game.js"></script>
</body>
</html>
